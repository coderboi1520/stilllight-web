<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#071219"/>
  <link rel="icon" href="data:,"/>
  <title>STILLLIGHT — Two-Glass Gameplay Demo</title>
  <style>
    .demo-result { text-align:center; }
    .demo-result h2 { margin:5px 0;color:#f5e7c4;font:700 15px Cinzel,Georgia,serif;letter-spacing:.14em }
    .demo-result .result-stars { color:#e7c580;letter-spacing:.2em;text-shadow:0 0 16px #d9b67788 }
    .demo-result p { color:#cdbd9b }
    .demo-result button { margin-top:10px }
    @keyframes demo-reveal { from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)} }
    @media (prefers-reduced-motion:reduce) {.demo-result{animation:none}}
  </style>
</head>
<body>
<main class="atelier" data-view="game" aria-label="STILLLIGHT gameplay demo">
  <div class="game-slot"><div class="board" aria-label="Two glass sorting bench">
    <div id="pixi-host" aria-hidden="true"></div><div class="hit-glasses"></div>
  </div></div>
  <footer data-screen="game">
    <p class="status" role="status" aria-live="polite" aria-atomic="true"></p>
    <section class="result demo-result" hidden aria-label="Level complete">
      <div class="result-stars" aria-label="Three stars"><span>★</span> <span>★</span> <span>★</span></div>
      <span class="rivet tl" aria-hidden="true"></span><span class="rivet tr" aria-hidden="true"></span><span class="rivet bl" aria-hidden="true"></span><span class="rivet br" aria-hidden="true"></span><span class="result-finial" aria-hidden="true">☾</span><h2>LEVEL CLEAR</h2>
      <p>Every color is settled.</p>
      <button class="primary" id="replay-demo" type="button">Replay Demo</button>
    </section>
  </footer>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
