<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071219" />
  <title>STILLLIGHT Original Canvas 10-Glass Uncapped Benchmark</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <script src="./src/uncapped-loop.js"></script>
</head>
<body>
  <main class="benchmark-shell">
    <section class="stage-wrap" aria-label="Benchmark viewport">
      <div class="stage" aria-label="STILLLIGHT original Canvas ten-glass uncapped stress benchmark">
        <canvas aria-hidden="true"></canvas>
        <div class="hit-glasses" aria-hidden="true"></div>
        <aside class="live-overlay" aria-label="Live benchmark metrics">
          <dl>
            <dt>Mode</dt><dd data-live="mode">10-glass</dd>
            <dt>Scheduler</dt><dd>Uncapped</dd>
            <dt>Cycle</dt><dd data-live="cycle">1</dd>
            <dt>Elapsed</dt><dd data-live="elapsed">0.00 s</dd>
            <dt>Current FPS</dt><dd data-live="fps">—</dd>
            <dt>Min FPS</dt><dd data-live="min-fps">—</dd>
            <dt>Avg FPS</dt><dd data-live="avg-fps">—</dd>
            <dt>Max FPS</dt><dd data-live="max-fps">—</dd>
            <dt>Frame ms</dt><dd data-live="frame-ms">—</dd>
            <dt>Active glasses</dt><dd data-live="active-glasses">0</dd>
            <dt>Active pours</dt><dd data-live="active-pours">0</dd>
          </dl>
        </aside>
      </div>
    </section>

    <pre class="summary" aria-live="polite">Waiting for first completed cycle…</pre>

    <!-- Hidden compatibility hooks for the original benchmark controller. -->
    <div hidden aria-hidden="true">
      <button type="button" data-mode="2-glass"></button>
      <button type="button" data-mode="10-glass"></button>
      <button type="button" data-action="start"></button>
      <button type="button" data-action="restart"></button>
    </div>
  </main>

  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/autoloop.js"></script>
</body>
</html>
