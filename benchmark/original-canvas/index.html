<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071219" />
  <title>STILLLIGHT Original Canvas Benchmark</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <main class="benchmark-shell">
    <nav class="toolbar" aria-label="Benchmark controls">
      <button type="button" data-mode="2-glass" aria-pressed="true">2 Glass Baseline</button>
      <button type="button" data-mode="10-glass" aria-pressed="false">10 Glass Stress</button>
      <button type="button" data-action="start">Start Benchmark</button>
      <button type="button" data-action="restart">Restart</button>
    </nav>

    <section class="stage-wrap" aria-label="Benchmark viewport">
      <div class="stage" aria-label="STILLLIGHT original two-glass Canvas baseline">
        <canvas aria-hidden="true"></canvas>
        <div class="hit-glasses" aria-label="Glass controls"></div>
        <aside class="live-overlay" aria-label="Live benchmark metrics">
          <dl>
            <dt>Mode</dt><dd data-live="mode">2-glass</dd>
            <dt>Elapsed</dt><dd data-live="elapsed">0.00 s</dd>
            <dt>FPS</dt><dd data-live="fps">—</dd>
            <dt>Frame ms</dt><dd data-live="frame-ms">—</dd>
            <dt>Active glasses</dt><dd data-live="active-glasses">0</dd>
            <dt>Active pours</dt><dd data-live="active-pours">0</dd>
          </dl>
        </aside>
      </div>
    </section>

    <pre class="summary" aria-live="polite" hidden></pre>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
