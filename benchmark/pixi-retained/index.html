<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071219" />
  <title>STILLLIGHT Retained Pixi 10-Glass Benchmark</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="../shared/uncapped-loop.js"></script>
</head>
<body>
  <aside class="live-overlay" aria-label="Live benchmark metrics">
    <dl>
      <dt>Backend</dt><dd>Pixi WebGL</dd>
      <dt>Mode</dt><dd>10-glass</dd>
      <dt>FPS target</dt><dd><select data-fps-target aria-label="FPS target"><option value="0" selected>Uncapped</option><option value="60">60</option><option value="75">75</option><option value="90">90</option><option value="120">120</option></select></dd>
      <dt>Scheduler</dt><dd data-scheduler-label>Uncapped</dd>
      <dt>Frame budget</dt><dd data-measure="frame-budget">—</dd>
      <dt>Cycle</dt><dd data-live="cycle">1</dd>
      <dt>Elapsed</dt><dd data-live="elapsed">0.00 s</dd>
      <dt>Phase</dt><dd data-measure="phase">Warmup</dd>
      <dt data-measure="fps-label">CPU Throughput</dt><dd data-live="fps">—</dd>
      <dt>Min FPS</dt><dd data-measure="min-fps">—</dd>
      <dt>Avg FPS</dt><dd data-measure="avg-fps">—</dd>
      <dt>Max FPS</dt><dd data-measure="max-fps">—</dd>
      <dt>1% Low</dt><dd data-measure="one-low">—</dd>
      <dt>Missed frames</dt><dd data-measure="missed-frames">—</dd>
      <dt>P95 frame</dt><dd data-measure="p95-ms">—</dd>
      <dt>P99 frame</dt><dd data-measure="p99-ms">—</dd>
      <dt>Current frame</dt><dd data-live="frame-ms">—</dd>
      <dt>Active glasses</dt><dd data-live="active-glasses">0</dd>
      <dt>Active pours</dt><dd data-live="active-pours">0</dd>
    </dl>
    <div hidden aria-hidden="true">
      <span data-live="min-fps"></span>
      <span data-live="avg-fps"></span>
      <span data-live="max-fps"></span>
    </div>
  </aside>

  <main class="benchmark-shell">
    <section class="stage" aria-label="STILLLIGHT retained Pixi ten-glass stress benchmark">
      <div id="pixi-benchmark-host"></div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
  <script type="module" src="../shared/measurement-overlay.js"></script>
</body>
</html>
